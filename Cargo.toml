[package]
name = "contextcut"
version = "0.3.0"
edition = "2024"
description = "Prepare focused repository context and budgeted change reviews for AI chats"
license = "MIT"
repository = "https://github.com/pallaprolus/contextcut"
keywords = ["llm", "ai", "context", "cli", "markdown"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
content_inspector = "0.2"
globset = "0.4"
ignore = "0.4"
serde_json = "1.0.150"
tiktoken-rs = "0.7"
ureq = "3.3.0"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
strip = true
