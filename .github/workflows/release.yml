name: Release binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        name: Verify release tag matches Cargo version
        shell: bash
        run: |
          version=$(python scripts/release.py version)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/v$version"
          else
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            executable: contextcut
            extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: contextcut
            extension: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            executable: contextcut
            extension: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: contextcut
            extension: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: contextcut.exe
            extension: zip
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Configure static Linux linking
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Configure static Windows runtime
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Test packaging helpers
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: python scripts/release.py package --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Smoke-test extracted archive
        run: python scripts/release.py smoke dist/contextcut-${{ needs.version.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Generate checksums and Homebrew formula
        run: python scripts/release.py manifest
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace assets of a published release"'
          else
            gh release create "$tag" --verify-tag --draft --title "ContextCut $tag" --notes-file docs/releases/"$tag".md
          fi
          gh release upload "$tag" dist/* --clobber
